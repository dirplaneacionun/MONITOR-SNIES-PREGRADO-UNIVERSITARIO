name: Pruebas del Dashboard

# Pruebas unitarias y de punta a punta del Dashboard (Chrome sin interfaz, con clics reales sobre cada control). Se
# ejecutan a mano (Actions → "Pruebas del Dashboard" → Run workflow) y cuando una solicitud de cambios o una publicación
# modifica el Dashboard, sus generadores o las pruebas. No se ejecutan con las actualizaciones semanales de datos: esas
# las publica el workflow "SNIES Monitor" con el token del repositorio, que no dispara otros workflows.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/assets/**"
      - "docs/*.html"
      - "Scripts/generar_dashboard.py"
      - "Scripts/generar_paginas.py"
      - "Scripts/catalogos.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pruebas_dashboard.yml"
  push:
    branches: [main]
    paths:
      - "docs/assets/**"
      - "docs/*.html"
      - "Scripts/generar_dashboard.py"
      - "Scripts/generar_paginas.py"
      - "Scripts/catalogos.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/pruebas_dashboard.yml"

# Solo lectura: las pruebas no modifican el repositorio.
permissions:
  contents: read

# Una ejecución por rama: una publicación nueva cancela la prueba que quedó atrás.
concurrency:
  group: pruebas-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      # Acciones fijadas a un commit exacto (las mismas del workflow semanal).
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Solo el navegador. El chromedriver lo descarga la propia prueba (webdriver-manager) con la versión que coincide con
      # Chrome: la acción instalaba uno de otra versión (160, con Chrome 157), y Selenium lo prefería al del navegador.
      - name: Configurar Google Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pruebas unitarias
        run: |
          set -euo pipefail
          python -m unittest discover -s tests

      # Versiones de Chrome y de los chromedriver disponibles: se publican también como anotación para poder diagnosticar
      # un desacuerdo de versiones sin abrir el registro completo.
      - name: Diagnóstico de Chrome y chromedriver
        run: |
          set +e
          {
            echo "chrome: $(command -v google-chrome) $(google-chrome --version 2>&1)"
            echo "chromedriver (PATH): $(command -v chromedriver) $(chromedriver --version 2>&1 | head -1)"
            echo "chromedriver (imagen, CHROMEWEBDRIVER='${CHROMEWEBDRIVER:-}'): $("${CHROMEWEBDRIVER:-/nonexistent}/chromedriver" --version 2>&1 | head -1)"
          } > "$RUNNER_TEMP/chrome.txt"
          cat "$RUNNER_TEMP/chrome.txt"
          resumen=$(cut -c1-300 "$RUNNER_TEMP/chrome.txt" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Chrome y chromedriver::${resumen:0:3000}"

      # Recorre las cuatro páginas con todos sus filtros, tablas y gráficas y compara cada valor con un cálculo
      # independiente sobre Historico/ y Novedades/ (unos 3.000 controles; tarda varios minutos).
      - name: Pruebas de punta a punta del Dashboard
        run: |
          # El shell de Actions se ejecuta con -e: se desactiva para conservar el código de salida y publicar el resumen
          set +e
          python tests/e2e_dashboard.py > "$RUNNER_TEMP/e2e.log" 2>&1
          estado=$?
          cat "$RUNNER_TEMP/e2e.log"
          if [ "$estado" -ne 0 ]; then
            # El final del registro se muestra también como anotación de la ejecución, sin abrir el registro completo
            resumen=$(grep -v '^#[0-9]' "$RUNNER_TEMP/e2e.log" | tail -n 25 | cut -c1-300 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Prueba de punta a punta del Dashboard::${resumen:0:3500}"
          fi
          exit "$estado"
