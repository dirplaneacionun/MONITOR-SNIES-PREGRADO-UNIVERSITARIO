name: SNIES Monitor

on:
  workflow_dispatch:
    inputs:
      enviar_correo:
        description: "Enviar el correo a los destinatarios (desactivar solo para pruebas)"
        type: boolean
        default: true
      forzar_validacion:
        description: "Aceptar una caída de más del 10 % de los programas (solo si se confirmó en el portal del SNIES)"
        type: boolean
        default: false

# Permisos mínimos: el token solo puede escribir contenido del repositorio (commit de resultados).
permissions:
  contents: write

# Nunca dos ejecuciones a la vez: la siguiente espera a que termine la anterior (evita commits cruzados).
concurrency:
  group: snies-monitor
  cancel-in-progress: false

jobs:
  run-snies:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      # Acciones fijadas a un commit exacto (no a una etiqueta movible) para evitar cambios no revisados.
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Solo la última versión: el pipeline no usa el historial y descargarlo completo
          # haría cada ejecución más lenta a medida que el repositorio crece.
          fetch-depth: 1
          # El token de escritura no queda guardado en .git/config durante el pipeline:
          # solo se usa en el paso "Publicar cambios".
          persist-credentials: false

      - name: Información de ejecución
        run: |
          set -euo pipefail
          echo "Hora UTC:      $(date -u)"
          echo "Hora Colombia: $(TZ=America/Bogota date)"
          echo "Repositorio:   $GITHUB_REPOSITORY"

      - name: Configurar Google Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1

      - name: Verificar Chrome
        run: google-chrome --version

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Pruebas unitarias de la lógica crítica (menos de un segundo). Si alguna falla, el pipeline
      # no se ejecuta y el histórico, las novedades y el Dashboard no se modifican.
      - name: Pruebas unitarias
        id: pruebas
        run: |
          set -euo pipefail
          python -m unittest discover -s tests 2>&1 | tee "$RUNNER_TEMP/pruebas_unitarias.log"

      - name: Alerta técnica por pruebas fallidas
        if: failure() && steps.pruebas.outcome == 'failure'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import datetime as dt, os, sys
          from pathlib import Path
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "Scripts")
          from send_report import enviar_alerta_falla
          enviar_alerta_falla(
              dt.datetime.now(ZoneInfo("America/Bogota")).date(), "PRUEBAS UNITARIAS",
              "Una o más pruebas unitarias fallaron: el pipeline no se ejecutó y los datos no se modificaron.",
              Path(os.environ["RUNNER_TEMP"]) / "pruebas_unitarias.log",
          )
          PYTHON

      - name: Ejecutar pipeline SNIES
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          # Se pasa como variable de entorno (no se inserta en el script) para evitar inyección de comandos.
          ENVIAR_CORREO: ${{ inputs.enviar_correo }}
          FORZAR_VALIDACION: ${{ inputs.forzar_validacion }}
        run: |
          set -euo pipefail
          # Disparado por cron-job.org (sin parámetros) las variables vienen vacías: se envía el correo y se
          # aplica la protección contra descargas incompletas.
          ARGS=()
          if [ "${ENVIAR_CORREO:-true}" = "false" ]; then ARGS+=(--sin-correo); fi
          if [ "${FORZAR_VALIDACION:-false}" = "true" ]; then ARGS+=(--forzar); fi
          python Scripts/run_snies.py "${ARGS[@]}"

      # El pipeline actualiza los datos del Dashboard (docs/data) antes de enviar el correo.
      # Se publica si el flujo termina (con éxito o con error, para conservar el log), pero no si se cancela.
      - name: Publicar cambios
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "snies-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A Novedades Historico Logs Scripts docs

          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi

          git commit -m "Actualización SNIES y dashboard: $(TZ=America/Bogota date +'%Y-%m-%d')"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
